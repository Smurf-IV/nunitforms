# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Publish Beta

on: workflow_dispatch

jobs:
  build:

    runs-on: windows-latest
    environment: Alpha
    permissions: write-all
      # packages: write
      # contents: read


    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        #ref: 'main'

    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          6.x
          8.x
          10.x
          11.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        check-latest: false
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore dependencies
      run: dotnet restore NUnitForms.slnx --no-cache
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    # - name: Build
    #   run: dotnet build NUnitForms.slnx --configuration Release --no-restore

    # - name: Test
    #   run: dotnet test NUnitForms.slnx --configuration Release --no-build --verbosity normal --settings source/.runsettings --maxcpucount:1

    - name: Pack
      run: dotnet pack "source/NUnitForms/NUnit.WinForms.csproj" --configuration Release --no-restore --version-suffix Alpha

    - name: PushGithub
      run: dotnet nuget push **/NUnit.WinForms.*.nupkg --no-symbols --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: PushNuget
      run: dotnet nuget push **/NUnit.WinForms.*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY  }} --skip-duplicate


